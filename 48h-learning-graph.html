function computePositions(tabId) {

    pos['l1_kg'] = { x: cx + 80, y: cy - 320 };
    pos['l1_m_kg'] = { x: cx + 250, y: cy - 260 };
    pos['l1_coldstart'] = { x: cx - 240, y: cy - 180 };
    pos['l1_plan'] = { x: cx - 60, y: cy - 200 };
    pos['l1_m_plan'] = { x: cx + 140, y: cy - 200 };
    // 右方 (教学循环) - 9 节点
    pos['l1_explain'] = { x: cx + 350, y: cy - 220 };
    pos['l1_feynman'] = { x: cx + 420, y: cy - 100 };
    pos['l1_fsrs'] = { x: cx + 480, y: cy + 20 };
    pos['l1_stage'] = { x: cx + 480, y: cy + 140 };
    pos['l1_rest'] = { x: cx + 420, y: cy + 260 };
    pos['l1_interrupt'] = { x: cx + 320, y: cy + 340 };
    pos['l1_checkpoint'] = { x: cx + 200, y: cy + 360 };
    pos['l1_anti_hallu'] = { x: cx + 600, y: cy - 80 };
    pos['l1_m_mastery'] = { x: cx + 580, y: cy + 100 };
    // 下方 (复盘) - 4 节点
    pos['l1_insight'] = { x: cx - 180, y: cy + 290 };
    pos['l1_artifact'] = { x: cx - 50, y: cy + 330 };
    pos['l1_sync'] = { x: cx + 90, y: cy + 330 };
    pos['l1_m_final'] = { x: cx + 230, y: cy + 290 };
    // 左方 (横切) - 4 节点
    pos['l1_redline'] = { x: cx - 380, y: cy - 100 };
    pos['l1_memory'] = { x: cx - 420, y: cy + 20 };
    pos['l1_trace'] = { x: cx - 400, y: cy + 140 };
    pos['l1_persist'] = { x: cx - 340, y: cy + 260 };
  }
  else if (tabId === 't2') {
    // 思维导图: 5 核心方法在五边形顶点 + 规则贴近 + 协作方法在外圈
    const cx = 750, cy = 450;
    pos['m_feynman'] = { x: cx - 250, y: cy - 280 };
    pos['m_scaffold'] = { x: cx, y: cy - 330 };
    pos['m_cognitive'] = { x: cx + 250, y: cy - 280 };
    pos['m_fsrs'] = { x: cx + 350, y: cy + 50 };
    pos['m_hysteresis'] = { x: cx + 180, y: cy + 320 };
    pos['m_nli'] = { x: cx - 180, y: cy + 320 };
    pos['m_kg'] = { x: cx - 350, y: cy + 50 };
    pos['m_route'] = { x: cx - 480, y: cy - 180 };
    pos['m_fsm_llm'] = { x: cx + 480, y: cy - 180 };
    pos['m_cog_load'] = { x: cx + 550, y: cy + 200 };
    pos['m_pgfga'] = { x: cx + 0, y: cy - 130 };
    pos['m_bkt_dkt'] = { x: cx + 0, y: cy + 130 };
    pos['m_3layer'] = { x: cx - 380, y: cy + 250 };
    pos['m_6strategy'] = { x: cx + 380, y: cy + 250 };
    // 规则贴近对应方法
    pos['r_clamp'] = { x: cx - 420, y: cy - 320 };
    pos['r_3layer_parse'] = { x: cx - 380, y: cy - 200 };
    pos['r_sanitize'] = { x: cx - 250, y: cy - 410 };
    pos['r_singleton'] = { x: cx + 470, y: cy + 0 };
    pos['r_again'] = { x: cx + 500, y: cy + 110 };
    pos['r_hyst_2d'] = { x: cx + 280, y: cy + 420 };
    pos['r_window7d'] = { x: cx + 80, y: cy + 410 };
    pos['r_nli_07'] = { x: cx - 280, y: cy + 420 };
    pos['r_kg_8min'] = { x: cx - 500, y: cy + 130 };
  }
  else if (tabId === 't3') {
    // 3 列布局: L1 | L2 | L3
    const xs = { L1: 180, L2: 600, L3: 1080 };
    T3_NODES.forEach(n => {
      const layer = n.layer || 'L1';
      const list = T3_NODES.filter(x => (x.layer || 'L1') === layer);
      const idx = list.indexOf(n);
      pos[n.id] = { x: xs[layer], y: 80 + idx * 110 };
    });
  }
  else if (tabId === 't4') {
    // 时间线: 锚点 y=100 沿 x=t 分布, 状态 y=320 沿 x 铺开, 动作 y=550 沿 x 铺开
    const minT = -1440, maxT = 2880;
    const xScale = (t) => 90 + ((t - minT) / (maxT - minT)) * 1320;
    T4_NODES.filter(n => n.kind === 'anchor').forEach(n => {
      pos[n.id] = { x: xScale(n.t), y: 100 };
    });
    const states = T4_NODES.filter(n => n.kind === 'state');
    states.forEach((n, i) => { pos[n.id] = { x: 180 + i * 220, y: 320 }; });
    const actions = T4_NODES.filter(n => n.kind === 'action');
    actions.forEach((n, i) => {
      const row = Math.floor(i / 9);
      const col = i % 9;
      pos[n.id] = { x: 100 + col * 165, y: 540 + row * 90 };
    });
  }
  return pos;
}

function buildElements(tabId) {
  const nodes = tabId === 't1' ? T1_NODES : tabId === 't2' ? T2_NODES
              : tabId === 't3' ? T3_NODES : T4_NODES;
  const edges = tabId === 't1' ? T1_EDGES : tabId === 't2' ? T2_EDGES
              : tabId === 't3' ? T3_EDGES : T4_EDGES;
  const positions = computePositions(tabId);

  return {
    nodes: nodes.map(n => ({
      data: { id: n.id, label: n.label, kind: n.kind, layer: n.layer,
              desc: n.desc, quote: n.quote, ref: n.ref, metric: n.metric, t: n.t },
      position: positions[n.id] || { x: 0, y: 0 }
    })),
    edges: edges.map(e => ({
      data: { id: e.id, source: e.source, target: e.target, label: e.label || '' }
    }))
  };
}

function buildStyle() {
  return [
    {
      selector: 'node',
      style: {
        'background-color': (ele) => KIND_COLORS[ele.data('kind')] || '#5a4a3e',
        'background-opacity': 0.95,
        'label': 'data(label)',
        // 根据节点背景亮度自动选字色:暗底用白字,亮底用深字
        'color': (ele) => {
          const bg = KIND_COLORS[ele.data('kind')] || '#5a4a3e';
          const hex = bg.replace('#', '');
          const r = parseInt(hex.substring(0,2),16);
          const g = parseInt(hex.substring(2,4),16);
          const b = parseInt(hex.substring(4,6),16);
          const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
          return lum > 0.55 ? '#1f1f1e' : '#ffffff';
        },
        'font-family': 'Source Serif Pro, Noto Serif SC, serif',
        'font-size': 11.5,
        'font-weight': 600,
        'text-valign': 'center',
        'text-halign': 'center',
        'text-wrap': 'wrap',
        'text-max-width': '110px',
        'shape': (ele) => KIND_SHAPES[ele.data('kind')] || 'round-rectangle',
        'width': (ele) => {
          const k = ele.data('kind');
          if (k === 'goal' || k === 'concept') return 125;
          if (k === 'method') return 105;
          if (k === 'metric' || k === 'anchor') return 88;
          if (k === 'code') return 135;
          if (k === 'action') return 100;
          if (k === 'state') return 130;
          if (k === 'subcap') return 110;
          return 80;
        },
        'height': (ele) => {
          const k = ele.data('kind');
          if (k === 'goal' || k === 'concept' || k === 'state' || k === 'code') return 52;
          if (k === 'method' || k === 'subcap') return 46;
          if (k === 'action') return 34;
          if (k === 'rule') return 30;
          if (k === 'metric' || k === 'anchor') return 52;
          return 38;
        },
        'border-width': 1.5,
        'border-color': '#faf9f5',
        'border-opacity': 0.9,
        'text-margin-y': 0,
        'text-outline-color': (ele) => {
          // 加细字描边,白底深字也有微衬底
          const bg = KIND_COLORS[ele.data('kind')] || '#5a4a3e';
          const hex = bg.replace('#', '');
          const r = parseInt(hex.substring(0,2),16);
          const g = parseInt(hex.substring(2,4),16);
          const b = parseInt(hex.substring(4,6),16);
          const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
          return lum > 0.55 ? '#ffffff' : '#000000';
        },
        'text-outline-width': 0.3,
        'text-outline-opacity': 0.15
      }
    },
    {
      selector: 'edge',
      style: {
        'width': 1.2,
        'line-color': '#c5beac',
        'target-arrow-color': '#c5beac',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'opacity': 0.55
      }
    },
    {
      selector: 'node:selected',
      style: {
        'border-width': 3,
        'border-color': '#d97757',
        'background-blacken': -0.08
      }
    },
    {
      selector: '.filtered-out',
      style: { 'opacity': 0.08, 'events': 'no', 'text-opacity': 0.1 }
    }
  ];
}

function renderTab(tabId) {
  currentTab = tabId;
  const meta = TAB_META[tabId];
  document.getElementById('metaPills').innerHTML = `
    <span class="pill"><span class="k">Tab</span> ${meta.name}</span>
    <span class="pill"><span class="k">节点</span> ${meta.count}</span>
    <span class="pill"><span class="k">边</span> ${meta.edges}</span>
    <span class="pill"><span class="k">布局</span> 思维导图</span>
  `;
  if (cy) { cy.destroy(); cy = null; }
  const elems = buildElements(tabId);
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: [...elems.nodes, ...elems.edges],
    style: buildStyle(),
    layout: { name: 'preset', fit: true, padding: 50 },
    minZoom: 0.2,
    maxZoom: 3,
    wheelSensitivity: 0.2
  });
  cy.on('tap', 'node', evt => showDrawer(evt.target.data()));
  cy.on('tap', evt => { if (evt.target === cy) closeDrawer(); });
  buildFilter(tabId);
}

function buildFilter(tabId) {
  const nodes = tabId === 't1' ? T1_NODES : tabId === 't2' ? T2_NODES
              : tabId === 't3' ? T3_NODES : T4_NODES;
  const kinds = [...new Set(nodes.map(n => n.kind))];
  document.getElementById('filterList').innerHTML = kinds.map(k => `
    <label class="filter-item">
      <input type="checkbox" checked data-kind="${k}">
      <span class="swatch" style="background:${KIND_COLORS[k] || '#4a4a4a'}"></span>
      <span>${KIND_LABELS[k] || k}</span>
    </label>
  `).join('');
  currentFilter = new Set(kinds);
  document.querySelectorAll('#filterList input').forEach(inp => {
    inp.addEventListener('change', () => {
      const k = inp.dataset.kind;
      if (inp.checked) currentFilter.add(k); else currentFilter.delete(k);
      cy.nodes().forEach(n => {
        if (currentFilter.has(n.data('kind'))) n.removeClass('filtered-out');
        else n.addClass('filtered-out');
      });
    });
  });
}

function showDrawer(n) {
  const tags = [];
  if (n.layer) tags.push(n.layer);
  if (n.kind) tags.push(KIND_LABELS[n.kind] || n.kind);
  if (n.metric) tags.push('指标: ' + n.metric);
  if (n.t !== undefined) tags.push('t = ' + n.t + ' 分钟');
  document.getElementById('drawerContent').innerHTML = `
    <div class="kind-tag">${KIND_LABELS[n.kind] || n.kind}${n.layer ? ' · ' + n.layer : ''}</div>
    <h2>${n.label}</h2>
    <div class="role">${n.quote || n.metric || ''}</div>
    <div class="section-label">描述</div>
    <p>${n.desc || '—'}</p>
    ${n.quote ? `<div class="quote">"${n.quote}"</div>` : ''}
    ${n.metric ? `<div class="section-label">可测指标</div><p>${n.metric}</p>` : ''}
    <div class="section-label">引用</div>
    <div class="ref">${n.ref || '—'}</div>
    <div class="section-label">标签</div>
    <div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
  `;
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTab(btn.dataset.tab);
  });
});

renderTab('t1');
</script>
</body>
